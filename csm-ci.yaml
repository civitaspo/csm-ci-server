repo_settings:
  settings:
    delete_branch_on_merge: true
    allow_auto_merge: false
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
  additional_managed_files:
    .github/PULL_REQUEST_TEMPLATE.md: managed-files/PULL_REQUEST_TEMPLATE.md
securefix:
  allow_workflow_changes: true
  routes:
    - name: release-pr
      from: default
      to: release/next
      workflow: .github/workflows/csm-ci-release-pr.yml
      paths:
        CHANGELOG.md: any
        .release-version: semver
        Cargo.toml: version-only
        Cargo.lock: version-only
        package.json: version-only
        pyproject.toml: version-only
        dbt_project.yml: version-only
        herdr-plugin.toml: version-only
