  server_app_id: 5467106
  server_bot_id: 347821498
approver:
  id: 347823687
  login: csm-ci-approver[bot]
trust:
  committers:
    - id: 4525500
      login: civitaspo
    - id: 199161495
      login: cursoragent
    - id: 29139614
      login: renovate[bot]
    - id: 49699333
      login: dependabot[bot]
  approvers:
    - id: 4525500
      login: civitaspo
  mergers:
    - id: 4525500
      login: civitaspo
  bot_mergers: []
merge:
  required_checks:
    - name: status-check
      app_id: 15368
  deadline_minutes: 60
policies:
  - type: signed-commits
  - type: trusted-committers
  - type: sensitive-paths
    paths:
      - .github/workflows/**
      - .github/actions/**
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/go.mod"
      - "**/go.sum"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "**/requirements*.txt"
      - "**/mise.toml"
      - "**/.mise.toml"
      - "**/mise.lock"
      - "**/.mise.lock"
      - "**/Makefile"
      - "**/Dockerfile*"
      - .goreleaser.*
      - scripts/**
      - "**/build.rs"
      - .cargo/**
      - "**/.cargo/**"
    exempt:
      - id: 29139614
        login: renovate[bot]
repositories:
  - name: civitaspo/csm-ci-server
    ops:
      - approve
      - merge
      - policy-check
  - name: civitaspo/csm-ci-actions
    ops:
      - approve
      - merge
      - policy-check
      - securefix
      - release
    release:
      build_type: js-action
  - name: civitaspo/dotfiles
    ops:
      - approve
      - merge
      - policy-check
  - name: civitaspo/dbt-authorized-models
    ops:
      - approve
      - merge
      - policy-check
      - securefix
      - release
    release:
      build_type: none
  - name: civitaspo/dbt-snowflake-iceberg-sync
    ops:
      - approve
      - merge
      - policy-check
      - securefix
      - release
    release:
      build_type: none
  - name: civitaspo/dbt-snowflake-rap-enforcement
    ops:
      - approve
      - merge
      - policy-check
      - securefix
      - release
    release:
      build_type: none
  - name: civitaspo/herdr-infobox
    ops:
      - approve
      - merge
      - policy-check
      - securefix
      - release
    release:
      build_type: none
  - name: civitaspo/herdr-linear-agent
    ops:
      - approve
      - merge
      - policy-check
      - securefix
      - release
    release:
      build_type: cargo-raw
      binary: herdr-linear-agent
      targets:
        - aarch64-apple-darwin
        - x86_64-apple-darwin
        - x86_64-unknown-linux-musl
        - aarch64-unknown-linux-musl
  - name: civitaspo/hook-relay-client-rs
    ops:
      - approve
      - merge
      - policy-check
      - securefix
      - release
    release:
      build_type: cargo-raw
      binary: hook-relay-client
      targets:
        - aarch64-apple-darwin
        - x86_64-apple-darwin
        - x86_64-unknown-linux-musl
        - aarch64-unknown-linux-musl
  - name: civitaspo/terraform-provider-sigma
    ops:
      - approve
      - merge
      - policy-check
      - securefix
      - release
    release:
      build_type: terraform-provider
      provider_name: sigma
repo_settings:
  settings:
    delete_branch_on_merge: true
    allow_auto_merge: false
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
  managed_files:
    .github/PULL_REQUEST_TEMPLATE.md: |
      ## Why

      ## What changed

      ## Scope

      ## Tradeoffs

      ## Blast Radius

      ## Verification
    .github/workflows/csm-ci-approve.yml: |
      name: csm-ci-approve
      # Each event submits a separate request; callers do not cancel earlier requests.
      # These workflows never check out PR code.
      # jactionlint ignore=concurrency-limits,dangerous-triggers
      on:
        pull_request_target:
          types: [opened, synchronize, reopened, ready_for_review]
        issue_comment:
          types: [created]
      permissions: {}
      jobs:
        request:
          # The called workflow mints the narrowly scoped Client App token.
          # jactionlint ignore=secrets-inherit
          uses: civitaspo/csm-ci-actions/.github/workflows/client-approve.yml@2b751e0f2e16bb8e7bdd57994a8d3e13cdb1879e
          secrets: inherit
    .github/workflows/csm-ci-policy-check.yml: |
      name: csm-ci-policy-check
      # Each event submits a separate request; callers do not cancel earlier requests.
      # These workflows never check out PR code.
      # jactionlint ignore=concurrency-limits,dangerous-triggers
      on:
        pull_request_target:
          types: [opened, synchronize, reopened, ready_for_review, edited]
      permissions: {}
      jobs:
        request:
          # The called workflow mints the narrowly scoped Client App token.
          # jactionlint ignore=secrets-inherit
          uses: civitaspo/csm-ci-actions/.github/workflows/client-policy-check.yml@2b751e0f2e16bb8e7bdd57994a8d3e13cdb1879e
          secrets: inherit
    .github/workflows/csm-ci-merge.yml: |
      name: csm-ci-merge
      # Each event submits a separate request; callers do not cancel earlier requests.
      # These workflows never check out PR code.
      # jactionlint ignore=concurrency-limits,dangerous-triggers
      on:
        issue_comment:
          types: [created]
      permissions: {}
      jobs:
        request:
          # The called workflow mints the narrowly scoped Client App token.
          # jactionlint ignore=secrets-inherit
          uses: civitaspo/csm-ci-actions/.github/workflows/client-merge.yml@2b751e0f2e16bb8e7bdd57994a8d3e13cdb1879e
          secrets: inherit
securefix:
  allow_workflow_changes: true
  routes:
    - name: release-pr
      from: default
      to: release/next
      workflow: .github/workflows/csm-ci-release-pr.yml
      paths:
        CHANGELOG.md: any
        .release-version: semver
        Cargo.toml: version-only
        Cargo.lock: version-only
        package.json: version-only
        pyproject.toml: version-only
        dbt_project.yml: version-only
        herdr-plugin.toml: version-only
