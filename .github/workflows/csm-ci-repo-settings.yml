name: csm-ci-repo-settings
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: Optional configured owner/repo target.
        type: string
        required: false
      targets:
        description: Comma-separated settings, rulesets, releases, managed-files, or all.
        type: string
        default: all
permissions: {}
jobs:
  settings:
    permissions:
      contents: read
    # Server environment secrets reach the reusable workflow through explicit names.
    uses: civitaspo/csm-ci-actions/.github/workflows/server-repo-settings.yml@a8645b8e9461dd9d3f0a03e09fe39e54d295cb0f
    with:
      repository: ${{ inputs.repository || '' }}
      targets: ${{ inputs.targets || 'all' }}
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
      CSM_CI_APPROVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
