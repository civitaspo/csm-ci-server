name: csm-ci-repo-settings
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: Optional configured owner/repo target.
        type: string
        required: false
      mode:
        description: Distribute managed files before activating repository protection.
        type: choice
        options: [managed-files-only, reconcile]
        default: managed-files-only
permissions: {}
jobs:
  settings:
    permissions:
      contents: read
    # Server environment secrets reach the reusable workflow only through inherit.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server-repo-settings.yml@53a1bc9024eaf67e23b1a91f8972e7b321596922
    with:
      repository: ${{ inputs.repository || '' }}
      mode: ${{ inputs.mode || 'reconcile' }}
    secrets: inherit
