name: csm-ci-repo-settings
run-name: csm-ci-repo-settings ${{ inputs.repository }}${{ inputs.managed-drift-key && format(' {0}', inputs.managed-drift-key) || '' }}
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: Optional configured owner/repo target.
        type: string
        required: false
      targets:
        description: Comma-separated settings, rulesets, releases, managed-files, or all.
        type: string
        default: all
      managed-drift-key:
        description: Deterministic key for automatic managed-file drift re-sync.
        type: string
        required: false
permissions: {}
jobs:
  settings:
    permissions:
      actions: write
      contents: read
    # Server environment secrets reach the reusable workflow through explicit names.
    uses: civitaspo/csm-ci-actions/.github/workflows/server-repo-settings.yml@52b726db3c90155c9bd7adc9c8766fa342994b35 # v0.11.0
    with:
      repository: ${{ inputs.repository || '' }}
      targets: ${{ inputs.targets || 'all' }}
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
      CSM_CI_APPROVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
