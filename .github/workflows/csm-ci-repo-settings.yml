name: csm-ci-repo-settings
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: Optional configured owner/repo target.
        type: string
        required: false
      mode:
        description: Distribute managed files before activating repository protection.
        type: choice
        options: [managed-files-only, reconcile]
        default: managed-files-only
permissions: {}
jobs:
  settings:
    permissions:
      contents: read
    # Server environment secrets reach the reusable workflow through explicit names.
    uses: civitaspo/csm-ci-actions/.github/workflows/server-repo-settings.yml@6c95a5e9b35e8eeba8e0c6f78055acc38b698bb4
    with:
      repository: ${{ inputs.repository || '' }}
      mode: ${{ inputs.mode || 'reconcile' }}
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
      CSM_CI_APPROVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
