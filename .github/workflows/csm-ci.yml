name: csm-ci
# Label requests must not cancel each other.
# jactionlint ignore=concurrency-limits
on:
  label:
    types: [created]
permissions: {}
jobs:
  server:
    # Environment credentials are consumed inside the trusted reusable workflow.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server.yml@cb80bbca315b446e92d8a1743d7cef19558199b4
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
      attestations: write
