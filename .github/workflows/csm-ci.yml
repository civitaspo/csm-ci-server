name: csm-ci
# Label requests must not cancel each other.
# jactionlint ignore=concurrency-limits
on:
  label:
    types: [created]
permissions: {}
jobs:
  server:
    # Environment credentials are consumed inside the trusted reusable workflow.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server.yml@f6e64ac04d9b4212d43fe6ff17e2892d9a2e221c
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
      attestations: write
