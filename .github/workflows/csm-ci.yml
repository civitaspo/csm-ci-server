name: csm-ci
# Label requests must not cancel each other.
# jactionlint ignore=concurrency-limits
on:
  label:
    types: [created]
permissions: {}
jobs:
  server:
    # Environment credentials are consumed inside the trusted reusable workflow.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server.yml@313dac1ce1e5a288fc2f5fe729e8f4ca7ad71180
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
      attestations: write
