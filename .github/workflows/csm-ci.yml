name: csm-ci
# Label requests must not cancel each other.
# jactionlint ignore=concurrency-limits
on:
  label:
    types: [created]
permissions: {}
jobs:
  server:
    # Environment credentials are consumed inside the trusted reusable workflow.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server.yml@0ebe098647fa14457a95749c68f8d7963d231a2e
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
      attestations: write
