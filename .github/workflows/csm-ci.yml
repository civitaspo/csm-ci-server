name: csm-ci
# Label requests must not cancel each other.
# jactionlint ignore=concurrency-limits
on:
  label:
    types: [created]
permissions: {}
jobs:
  server:
    # Environment credentials are consumed inside the trusted reusable workflow.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server.yml@85d8fc79ef0ca89ec4cc073d142dab75ebe09a66
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
      attestations: write
