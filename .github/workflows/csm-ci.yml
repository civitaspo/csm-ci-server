name: csm-ci
# Label requests must not cancel each other.
# jactionlint ignore=concurrency-limits
on:
  label:
    types: [created]
permissions: {}
jobs:
  server:
    # Environment credentials are consumed inside the trusted reusable workflow.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server.yml@53a1bc9024eaf67e23b1a91f8972e7b321596922
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
      attestations: write
