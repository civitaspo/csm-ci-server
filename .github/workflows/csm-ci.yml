name: csm-ci
# Label requests must not cancel each other.
# jactionlint ignore=concurrency-limits
on:
  label:
    types: [created]
permissions: {}
jobs:
  server:
    # Environment credentials are consumed inside the trusted reusable workflow.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server.yml@8220823b5b49f7be4af55e7c4fbdbb0d881f3e9d
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
      attestations: write
