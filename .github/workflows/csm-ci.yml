name: csm-ci
# Label requests must not cancel each other.
# jactionlint ignore=concurrency-limits
on:
  label:
    types: [created]
permissions: {}
jobs:
  server:
    # Environment credentials are consumed inside the trusted reusable workflow.
    # jactionlint ignore=secrets-inherit
    uses: civitaspo/csm-ci-actions/.github/workflows/server.yml@82917b4c3a28e5ff4023991ed355b40081d650fb
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
      attestations: write
