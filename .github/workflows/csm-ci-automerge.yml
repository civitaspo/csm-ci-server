name: csm-ci automerge
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  sweep:
    uses: civitaspo/csm-ci-actions/.github/workflows/server-automerge.yml@e0791d2e097fccb8e2fa58bb35ec305e336cc3c5 # v0.10.0
    permissions:
      actions: write
      contents: read
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
