name: csm-ci-check
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: civitaspo/csm-ci-actions/.github/workflows/server-check.yml@6c95a5e9b35e8eeba8e0c6f78055acc38b698bb4
    permissions:
      contents: read
  status-check:
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require configuration and workflow validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
