name: csm-ci-check
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: civitaspo/csm-ci-actions/.github/workflows/server-check.yml@4eec63156502010e1d11aa0e5b7ff31a64788d3e # v0.6.0
    permissions:
      contents: read
  status-check:
    if: always()
    needs: [validate]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require configuration and workflow validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
